server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 82.23.173.175 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://82.23.173.175$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 82.23.173.175 _;

    ssl_certificate /etc/letsencrypt/live/obed-server/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obed-server/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/obed-locations.conf;
}
