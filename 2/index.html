<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Обратная связь</h1>
        <nav>
            <a href="../1/index.html">Главная</a>
            <a href="index.html">Обратная связь</a>
            <a href="login.html">Вход</a>
        </nav>
    </header>
    <main>
        <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
            <div class="form-field">
                <label for="full-name">ФИО</label>
                <input type="text" id="full-name" name="full_name" required>
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <fieldset>
                <legend>Откуда узнали о нас?</legend>
                <label><input type="radio" name="source" value="internet" required> Из интернета</label>
                <label><input type="radio" name="source" value="friends"> От друзей</label>
                <label><input type="radio" name="source" value="advertising"> Из рекламы</label>
            </fieldset>
            <div class="form-field">
                <label for="request-type">Тип обращения</label>
                <select id="request-type" name="request_type">
                    <option value="complaint">Жалоба</option>
                    <option value="suggestion">Предложение</option>
                </select>
            </div>
            <div class="form-field">
                <label for="message">Текст сообщения</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <div class="form-field">
                <label for="attachments">Вложения</label>
                <input type="file" id="attachments" name="attachments" multiple>
            </div>
            <div class="form-field">
                <label><input type="checkbox" name="consent" value="yes" required> Даю согласие на обработку персональных данных</label>
            </div>
            <button type="submit">Отправить</button>
        </form>
    </main>
</body>
</html>
